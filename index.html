nd:rgba(2,4,5,.65);backdrop-filter:blur(5px)}.card{width:min(720px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:clamp(20px,4vw,40px);box-shadow:0 20px 80px #000}.card h2{margin:6px 0 10px;font-size:clamp(24px,4vw,40px);letter-spacing:-.04em}.card p{color:#9ca8a1;line-height:1.55}.row{display:flex;flex-wrap:wrap;gap:9px;margin:17px 0}.action{cursor:pointer;background:#151d1a;border:1px solid #465346;padding:12px 16px;text-transform:uppercase;font-size:11px;font-weight:850;letter-spacing:.1em}.action:hover,.action.active{background:var(--acid);color:#10130d;border-color:var(--acid)}.back{border-color:#5c343b}.locked{opacity:.5;cursor:not-allowed}.note{font-size:11px;color:#829087}.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gallery-grid button{min-height:90px;background:#121817;border:1px solid #344039;text-align:left;padding:10px;cursor:pointer}.gallery-grid button.selected{border-color:var(--acid);box-shadow:inset 0 0 20px #b6ff4215}.gallery-grid strong{display:block;font-size:12px}.gallery-grid span{font-size:9px;color:#88938d}.setting{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff13;padding:12px 0;color:#aab4ae;font-size:12px}.setting input{accent-color:var(--acid)}
#hud{position:absolute;inset:0;display:none;pointer-events:none;padding:clamp(12px,3vw,34px)}.hud-top{display:flex;align-items:start;gap:18px}.healthbox{width:min(39vw,440px)}.name{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;margin-bottom:7px}.health-track{height:13px;background:#171b1b;border:1px solid #59615c;transform:skewX(-13deg);overflow:hidden}.health-fill{height:100%;width:100%;background:linear-gradient(90deg,#77cf39,#d5ff62);transition:width .18s}.enemy .health-fill{background:linear-gradient(90deg,#d3374a,#ff6d61)}.hud-center{margin:auto;text-align:center;padding:4px 12px;color:#f5f2e5;font-weight:900;font-size:14px;letter-spacing:.14em;text-shadow:0 2px 8px #000}.hud-center small{display:block;font-size:8px;color:#8f9a92;letter-spacing:.22em}.status{position:absolute;left:50%;top:89px;transform:translateX(-50%);color:var(--acid);font-weight:900;font-size:11px;letter-spacing:.2em;text-shadow:0 2px 5px #000}.round-msg{position:absolute;top:36%;left:0;right:0;text-align:center;font-size:clamp(26px,6vw,60px);font-weight:1000;letter-spacing:.12em;text-shadow:0 0 24px #b6ff4277;display:none}.controls{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:space-between;align-items:end;padding:0 4vw;pointer-events:none}.control-cluster{display:flex;gap:9px;align-items:end;pointer-events:auto}.ctrl{width:clamp(48px,8vw,72px);height:clamp(48px,8vw,72px);border-radius:50%;border:1px solid #d5efb353;background:#0a1010b8;color:#f2f4e9;font-weight:900;touch-action:none;user-select:none;box-shadow:0 4px 18px #0008;backdrop-filter:blur(4px)}.ctrl.attack{background:#18231aeb;border-color:#b6ff4270;color:var(--acid)}.ctrl.special{background:#38131beb;border-color:#ff315780;color:#ff7286}.ctrl:active,.ctrl.held{background:var(--acid);color:#111}.ctrl.block{font-size:9px}.control-col{display:grid;gap:8px}.control-col .ctrl{width:55px;height:55px}.menu-game{position:absolute;top:15px;right:18px;pointer-events:auto;display:none}.menu-game button{background:#080b0dd9;border:1px solid #aaa5;color:#eee;padding:8px 12px;font-size:9px;letter-spacing:.12em}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#d8e6d8;font-size:10px;letter-spacing:.1em;text-shadow:0 2px 5px #000;white-space:nowrap}.rotate{display:none;position:absolute;inset:0;z-index:20;background:#050708;place-items:center;text-align:center;padding:35px;color:#bec8bf;font-size:13px;letter-spacing:.1em}.rotate strong{color:var(--acid);display:block;font-size:22px;margin-bottom:8px}@media (orientation:portrait){.rotate{display:grid}#menu,#hud,.panel{visibility:hidden}}@media(max-width:650px){#menu{grid-template-columns:1fr;padding:24px;align-content:center;gap:15px}.brand{font-size:clamp(34px,10vw,62px)}.tagline{margin:12px 0 14px}.nav{grid-template-columns:1fr 1fr;gap:5px}.nav button{padding:10px;font-size:10px}.nav button small{display:none}.showcase{position:absolute;z-index:-1;right:0;top:0;width:100%;height:100%;opacity:.4;border:0}.menu-meta{display:none}.gallery-grid{grid-template-columns:repeat(2,1fr)}.healthbox{width:36vw}.hud-top{gap:7px}.hud-center{font-size:10px}.status{top:72px}.ctrl{width:50px;height:50px}.control-col .ctrl{width:47px;height:47px}}

<body><main id="game"><canvas id="scene"></canvas><div class="grain"></div><div class="vignette"></div>
<div class="rotate"><div><strong>ROTATE DEVICE</strong>G1itḥeď a Pªrt is designed for landscape play.</div></div>
<section id="menu"><div><div class="eyebrow">Offline combat · 2.5D fighter</div><div class="brand">G1itḥeď<br>a Pªrt</div><div class="tagline">THE CITY GLITCHES. YOU HIT BACK.</div><nav class="nav"><button data-panel="play">Play <small>Choose your fight</small></button><button data-panel="practice">Practice <small>Free training</small></button><button data-panel="gallery">Gallery <small>Fighters & lore</small></button><button data-panel="settings">Settings <small>Preferences</small></button><button data-panel="shop">Shop <small>Collection</small></button></nav></div><div class="showcase"><div class="showcase-label"><span id="showArena">ALLEYWAY · SHOWCASE</span><strong>G1ITH vs THE WARDEN</strong></div></div><div class="menu-meta">A HAND-CRAFTED GLITCH FIGHTER // BUILD 0.1</div></section>

<script>
(() => {
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),menu=$('#menu'),panel=$('#panel'),card=$('#card'),hud=$('#hud'),controls=$('#controls');
let W=0,H=0,dpr=1,last=0,sceneTime=0,screen='menu',arena='alley',difficulty='normal',gameMode='survival',round=1,roundsWon=0,toastUntil=0,stageIntro=true,qualityCards=true,selectedGallery='G1ith',playerSide='player',badCard=false;
const input={left:false,right:false,down:false,block:false};
let player,enemy,projectiles=[],particles=[],keys=new Set(),fightEnd=0,enemyThink=0,attackCount=0,combo=0,comboUntil=0,shake=0;
const arenaNames={alley:'ALLEYWAY',jungle:'JUNGLE RUINS',ship:'PIRATE SHIP'};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function toast(msg,d=1800){$('#toast').textContent=msg;toastUntil=performance.now()+d}
function showPanel(html){card.innerHTML=html;panel.style.display='grid';menu.style.display='none'}
function closePanel(){panel.style.display='none';menu.style.display='grid'}
function mainMenu(){screen='menu';menu.style.display='grid';panel.style.display='none';hud.style.display='none';controls.style.display='none';$('#menuGame').style.display='none';$('#roundMsg').style.display='none';$('#showArena').textContent=arenaNames[arena]+' · SHOWCASE';draw()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openSection(b.dataset.panel));
function openSection(key){if(key==='play')return showPanel(`<div class="eyebrow">Choose your way in</div><h2>PLAY</h2><p>Real-time fights. Your hands, your timing.</p><div class="row"><button class="action" data-start="survival">Survival</button><button class="action" data-start="tournament">Tournament</button><button class="action locked" title="Under development">Story · In development</button></div><div class="micro">DIFFICULTY</div><div class="row">${['easy','normal','hard','expert'].map(v=>`<button class="action ${difficulty===v?'active':''}" data-diff="${v}">${v}</button>`).join('')}</div><div class="micro">ARENA</div><div class="row">${Object.keys(arenaNames).map(v=>`<button class="action ${arena===v?'active':''}" data-arena="${v}">${arenaNames[v]}</button>`).join('')}</div><p class="note">Easy: lighter enemy damage · Hard: more enemy health · Expert: more health and damage.</p><button class="action back" data-back>Back</button>`);
if(key==='practice')return showPanel(`<div class="eyebrow">Training mode · no pressure</div><h2>PRACTICE</h2><p>Move, attack and learn your timing against a stationary training dummy. The dummy cannot move, attack, defend, or change distance.</p><div class="row"><button class="action" data-start="practice">Train as G1ith</button><button class="action" data-start="practiceEnemy">Control the enemy</button><button class="action" data-tutorial>Controls tutorial</button></div><p class="note">Move ◀ ▶ · Jump ↑ / J · Crouch ↓ · Dodge Shift / L · Light F · Heavy G · Guard H · Fireball E</p><button class="action back" data-back>Back</button>`);
if(key==='gallery')return showPanel(`<div class="eyebrow">Collected fighters</div><h2>GALLERY <span class="note">HEROES / ENEMIES</span></h2><div class="gallery-grid">${[['G1ith','HERO'],['The Warden','ENEMY · ARMORED'],['Dockhand','ENEMY · PIRATE'],['Hollow','ENEMY · SKELETON']].map(([n,t])=>`<button class="${selectedGallery===n?'selected':''}" data-gallery="${n}"><strong>${n}</strong><span>${t}</span></button>`).join('')}</div><div id="lore" class="note" style="margin:18px 0">${galleryLore(selectedGallery)}</div><button class="action back" data-back>Back</button>`);
if(key==='settings')return showPanel(`<div class="eyebrow">Preferences</div><h2>SETTINGS</h2><div class="setting"><span>Screen shake</span><input type="checkbox" id="shakeToggle" checked></div><div class="setting"><span>Combat hints</span><input type="checkbox" id="hintsToggle" checked></div><div class="setting"><span>Audio</span><span class="note">No external audio in this build</span></div><p class="note">Landscape play is recommended. Browser audio and device orientation behavior depend on your device.</p><button class="action back" data-back>Back</button>`);
if(key==='shop')return showPanel(`<div class="eyebrow">Offline collection</div><h2>SHOP</h2><p>No purchases or currency are implemented in this offline prototype. Nothing here costs real money.</p><div class="row"><button class="action" data-shopinfo>Collection info</button></div><p class="note" id="shopNote">The current build includes G1ith and three visual opponent concepts.</p><button class="action back" data-back>Back</button>`)}
function galleryLore(n){return ({G1ith:'A teenager in a city that forgets itself. Green code crawls over his black clothes; his fire turns the pattern crimson. Moves: glitch jab, rising strike, redline fireball.', 'The Warden':'A faceless enforcer built to hold the line. A patient guard, punishing counter and heavy cross. Moves: guard, crushing hook.',Dockhand:'A hard-bitten pirate bruiser from the black water. Moves: cutlass feint, shoulder rush.',Hollow:'A reassembled sentinel with a hollow stare. Moves: bone rake, low sweep.'})[n]||''}
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.back!==undefined)return closePanel();if(b.dataset.diff){difficulty=b.dataset.diff;openSection('play')}if(b.dataset.arena){arena=b.dataset.arena;openSection('play')}if(b.dataset.start)startFight(b.dataset.start);if(b.dataset.tutorial)showTutorial();if(b.dataset.gallery){selectedGallery=b.dataset.gallery;openSection('gallery')}if(b.dataset.shopinfo)$('#shopNote').textContent='Gallery entries are visual concepts; collection unlocks are planned.'});
function showTutorial(){showPanel(`<div class="eyebrow">Quick start</div><h2>THE FIGHT IS YOURS</h2><p>Stay in range. Light attacks are quick; heavy attacks hit harder and take longer. Land consecutive hits to build a combo. Guard reduces incoming damage. Dodge gives a brief escape window. Jump over a low attack or crouch under a high one.</p><p><b>Fireball:</b> E / G-⚡ launches a red glitch projectile. The clothes turn red while it charges. Use it at range; it can be blocked.</p><p class="note">Keyboard: A/D or ←/→ move · W/↑ jump · S/↓ crouch · Shift dodge · F light · G heavy · H guard · E special · Esc pause</p><button class="action" data-start="practice">Train now</button> <button class="action back" data-back>Back</button>`)}
function setupRound(){const maxP=100,maxE=100*(difficulty==='hard'?1.3:difficulty==='expert'?1.55:1),practice=gameMode.startsWith('practice'),leftSide=playerSide==='player';player={x:leftSide?W*.32:W*.68,y:0,vx:0,vy:0,health:maxP,max:maxP,face:leftSide?1:-1,ground:true,state:'idle',timer:0,stun:0,invuln:0,guard:false,crouch:false,redUntil:0};enemy={x:leftSide?W*.68:W*.32,y:0,vx:0,vy:0,health:maxE,max:maxE,face:leftSide?-1:1,ground:true,state:'idle',timer:0,stun:0,invuln:0,guard:false,crouch:false};projectiles=[];particles=[];fightEnd=0;stageIntro=true;$('#roundMsg').textContent=practice?'TRAINING':'ROUND '+String(round).padStart(2,'0');$('#roundMsg').style.display='block';setTimeout(()=>{if(screen==='fight'){$('#roundMsg').style.display='none';stageIntro=false}},1050);updateHUD()}
$('#quitFight').onclick=()=>{if(screen!=='fight')return;screen='pause';showPanel(`<div class="eyebrow">Fight paused</div><h2>TAKE A BREATH</h2><div class="row"><button class="action" data-resume>Resume fight</button><button class="action back" data-quit>Exit to title</button></div>`)};
panel.addEventListener('click',e=>{if(e.target.closest('[data-resume]')){panel.style.display='none';screen='fight'}if(e.target.closest('[data-quit]'))mainMenu()});
function updateHUD(){$('#pHealth').style.width=Math.max(0,player.health/player.max*100)+'%';$('#eHealth').style.width=Math.max(0,enemy.health/enemy.max*100)+'%';$('#pCombo').textContent=combo>1&&performance.now()<comboUntil?' · '+combo+' HIT':''}
function hitstun(f,d){f.stun=d;f.state='hurt';f.timer=.2}
function attack(who,type){if(screen!=='fight'||stageIntro||fightEnd||who.stun>0||who.state==='attack'||who.state==='special'||who.state==='dodge')return;if(who!==player&&gameMode.startsWith('practice'))return;
who.state=type==='special'?'special':'attack';who.timer=type==='light'?.27:type==='heavy'?.52:.7;who.attackType=type;who.didHit=false;
if(type==='special'){who.redUntil=performance.now()+700;who.timer=.62;if(who===player){const dir=who.face;projectiles.push({x:who.x+dir*37,y:H*.61,vx:dir*560,life:1.6,owner:who,r:13,damage:18});burst(who.x, H*.56,'#ff3157',12)}else projectiles.push({x:who.x+who.face*35,y:H*.61,vx:who.face*390,life:1.5,owner:who,r:11,damage:13})}
else{const reach=type==='light'?Math.min(96,W*.12):Math.min(120,W*.15);const dist=Math.abs(enemy.x-who.x);if(dist<reach&&Math.sign(enemy.x-who.x)===who.face){if(who===player)landHit(enemy,type==='light'?8:15,who,type);else landHit(player,type==='light'?8:14,who,type)}}}
function landHit(target,damage,source,type){if(target.invuln>0)return;if(target.guard&&type!=='special'){damage*=.24;burst(target.x,H*.56,'#b6ff42',4)}else{hitstun(target,type==='heavy'?.4:.25);target.vx=source.face*(type==='heavy'?290:170);shake=type==='heavy'?9:4;burst(target.x,H*.54,type==='special'?'#ff3157':'#d7f0ac',8)}target.health=Math.max(0,target.health-damage);if(source===player){if(performance.now()<comboUntil)combo++;else combo=1;comboUntil=performance.now()+1200}updateHUD()}
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-180,180),vy:rand(-210,70),life:rand(.16,.55),max:.55,color,size:rand(2,5)})}
function dodge(){if(screen!=='fight'||stageIntro||player.stun>0||player.state==='dodge')return;player.state='dodge';player.timer=.42;player.invuln=.3;player.vx=(input.left?-1:input.right?1:-player.face)*360;}
function handlePress(a){if(a==='jump'&&player.ground&&player.stun<=0&&screen==='fight'){player.vy=-540;player.ground=false;player.state='jump'}else if(a==='dodge')dodge();else if(['light','heavy','special'].includes(a))attack(player,a)}
function keydown(e){const k=e.key.toLowerCase();if([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(k))e.preventDefault();keys.add(k);if(k==='escape'&&screen==='fight')$('#quitFight').click();if(k==='a'||k==='arrowleft')input.left=true;if(k==='d'||k==='arrowright')input.right=true;if(k==='s'||k==='arrowdown')input.down=true;if(k==='h')input.block=true;if(!e.repeat){if(k==='f')handlePress('light');if(k==='g')handlePress('heavy');if(k==='e')handlePress('special');if(k==='shift'||k==='l')handlePress('dodge');if(k==='w'||k==='arrowup'||k===' ')handlePress('jump')}}
function keyup(e){const k=e.key.toLowerCase();keys.delete(k);if(k==='a'||k==='arrowleft')input.left=false;if(k==='d'||k==='arrowright')input.right=false;if(k==='s'||k==='arrowdown')input.down=false;if(k==='h')input.block=false}addEventListener('keydown',keydown);addEventListener('keyup',keyup);addEventListener('blur',()=>{input.left=input.right=input.down=input.block=false;keys.clear()});
document.querySelectorAll('.ctrl').forEach(b=>{const hold=b.dataset.hold,press=b.dataset.press;const down=e=>{e.preventDefault();b.classList.add('held');if(hold)input[hold]=true;if(press)handlePress(press)};const up=e=>{e.preventDefault();b.classList.remove('held');if(hold)input[hold]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});

function path(points,fill,stroke=null,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawBackground(t){const floor=H*.81;let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101819');g.addColorStop(.52,arena==='jungle'?'#172319':arena==='ship'?'#182126':'#171c1e');g.addColorStop(1,'#080a0b');rect(0,0,W,H,g);
